{% if form.non_field_errors %}
    <div class="rounded-xl bg-white p-4 text-sm font-medium text-red-800" role="alert">
        {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
    </div>
{% endif %}
{% for field in form %}
    <div>
        <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-semibold">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
            <p class="mt-1 text-sm font-medium text-red-800">{{ error }}</p>
        {% endfor %}
        {% if field.help_text %}
            <div class="mt-1 text-sm leading-snug text-musgo [&_ul]:list-disc [&_ul]:pl-5">{{ field.help_text }}</div>
        {% endif %}
    </div>
{% endfor %}
